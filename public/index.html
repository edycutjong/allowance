<title>Allowance</title>
<meta name="description" content="A GitHub bot that reproduces bug reports in a sandbox, and gives every contributor a small daily allowance of model spend.">
<style>
  body { font: 16px/1.55 system-ui, sans-serif; max-width: 40rem; margin: 12vh auto; padding: 0 1.25rem; color: #1c1b19; background: #f6f3ec; }
  h1 { font-size: 2rem; margin: 0 0 .5rem; }
  code { font: .95em ui-monospace, monospace; background: #e9e4d8; padding: .1em .35em; border-radius: 3px; }
  a { color: #8a3b12; }
</style>
</head>
<body>
<main>
<h1>Allowance</h1>
<p>Comment <code>/repro</code> on a bug report. An open-weight model writes a minimal script, Otari's sandbox runs it, and the verdict comes from the exit code. Each contributor spends from an allowance of their own.</p>
<p>See it working on <a href="https://github.com/edycutjong/allowance-demo/issues">the demo repository's issues</a>.</p>
</main>
</body>
</html>
