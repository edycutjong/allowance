version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: otari
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # majors are migrations, not maintenance
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: otari
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
