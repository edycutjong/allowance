name: audit
on:
  push:
    branches: [otari, main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
